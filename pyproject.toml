[project]
name = "ai-fiscal-rag"
version = "0.1.0"
description = "Experimental RAG API for fiscal and exchange-rate questions using Treasury data and Gemini"
authors = [
    {name = "Pablo Felipe", email = "pablofelipe@gmail.com"}
]
readme = "README.md"
license = "MIT"
package-mode = false
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "chromadb (>=1.5.8,<2.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.9,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
