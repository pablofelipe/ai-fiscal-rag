name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # No GEMINI_API_KEY needed: tests mock GeminiService (app/gemini_service.py)
    # and app.core.config.settings directly, so the pipeline never makes a real
    # Gemini call in CI.
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check .

      - name: Run tests
        run: poetry run pytest
